name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Linter
        run: npm run lint

      - name: Run Typecheck
        run: npx tsc --noEmit

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: "dummy-secret-for-ci-building"
          DATABASE_URL: "postgresql://dummy-user:dummy-pass@localhost:5432/dummy-db"
